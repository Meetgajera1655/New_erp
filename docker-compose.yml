version: '3.8'

services:
  web:
    build: .
    container_name: erp_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=your_super_secret_jwt_key
      - ALGORITHM=HS256
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    # Using a volume to mount code for hot-reloading in development
    volumes:
      - .:/app
    # Overriding command to enable reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    container_name: erp_db
    environment:
      - POSTGRES_USER=erp_user
      - POSTGRES_PASSWORD=erp_password
      - POSTGRES_DB=erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
